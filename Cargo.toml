[package]
name = "converter-desk"
version = "0.1.0"
edition = "2021"

[lib]
name = "converter_desk"
path = "src/lib.rs"

[[bin]]
name = "converter-desk"
path = "src/main.rs"

[dependencies]
url = "2.5.4"
thiserror = "2.0.12"
eframe = "0.35"
rfd = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_extras = { version = "0.35", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] }
ureq = "3"

[dev-dependencies]
tempfile = "3.19.1"
